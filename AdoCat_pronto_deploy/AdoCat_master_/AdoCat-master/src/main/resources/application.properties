# Banco: em producao defina DB_URL, DB_USERNAME e DB_PASSWORD nas variaveis de ambiente
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/adocat?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Porta: Render/Railway definem PORT automaticamente
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
