# AdoCat - credenciais somente por variaveis de ambiente.
# No EasyPanel, SPRING_DATASOURCE_URL/USERNAME/PASSWORD possuem prioridade sobre este arquivo.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/adocat}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
