<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · AdoCat Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf3ef;color:#1c362a;font-family:system-ui,Arial;min-height:100vh;display:grid;place-items:center;padding:16px}.login{background:#fff;border:1px solid #e2ebe5;box-shadow:0 22px 70px #12352512;border-radius:24px;padding:34px;width:min(430px,100%)}.mark{width:54px;height:54px;border-radius:16px;background:#2c7458;display:grid;place-items:center;color:#fff;font-size:29px}h1{font-size:1.9rem;margin:14px 0 0}p{color:#728079;line-height:1.5;margin:8px 0 26px}label{display:block;font-size:.85rem;font-weight:750;margin-bottom:7px}input{display:block;width:100%;margin-bottom:18px;padding:13px;border-radius:11px;border:1px solid #d7e1db;font:inherit}button{width:100%;background:#2c7458;color:#fff;border:0;border-radius:11px;padding:14px;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.6}a{color:#2c7458;text-decoration:none}.foot{margin-top:20px;text-align:center;font-size:.86rem}.err{color:#a63737;background:#fff0ef;padding:11px;border-radius:9px;margin-bottom:16px;display:none}</style></head>
<body><main class="login"><div class="mark">🐈</div><h1>AdoCat Admin</h1><p>Área restrita para a equipe responsável pelos animais e doações.</p><div id="error" class="err" role="alert"></div>
<form method="post" action="/login" id="loginForm"><input type="hidden" id="csrf" name="_csrf" value=""><label for="username">Usuário</label><input id="username" name="username" autocomplete="username" required><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit" id="submit" disabled>Entrar no painel</button></form><div class="foot"><a href="/">Voltar ao site</a></div></main>
<script>
const params=new URLSearchParams(location.search), box=document.getElementById('error');
if(params.has('error')){box.textContent='Usuário ou senha incorretos.';box.style.display='block';}
if(params.has('logout')){box.textContent='Você saiu do painel.';box.style.display='block';}
fetch('/api/security/csrf',{credentials:'same-origin'}).then(r=>{if(!r.ok)throw Error('Não foi possível preparar o login');return r.json()}).then(data=>{document.getElementById('csrf').name=data.parameterName;document.getElementById('csrf').value=data.token;document.getElementById('submit').disabled=false;}).catch(()=>{box.textContent='Erro ao preparar a sessão. Atualize a página.';box.style.display='block';});
</script></body></html>
